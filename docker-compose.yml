services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fesco-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: fesco
      POSTGRES_USER: fesco_admin
      POSTGRES_PASSWORD: fesco_secure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fesco_admin -d fesco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
