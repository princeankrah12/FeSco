name: FeSCo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Lexicon Gate (Banned Terminology Scan)
        run: node tooling/lexicon/bin/fesco-lexicon.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Run Test Suites
        run: |
          npm test -w @fesco/lexicon
          npm test -w @fesco/tokens
          npm test -w @fesco/domain
          npm test -w @fesco/api
